<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Network Graph</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0a;
    overflow: hidden;
    font-family: 'Malgun Gothic', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    display: block;
    cursor: default;
  }
  #legend {
    position: fixed;
    top: 20px;
    left: 20px;
    color: #fff;
    font-size: 13px;
    line-height: 1.8;
    z-index: 10;
  }
  #legendToggle {
    position: fixed;
    top: 16px;
    left: 16px;
    z-index: 20;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 8px 12px;
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 8px;
    background: rgba(0,0,0,0.82);
    color: #fff;
    font-size: 12px;
    line-height: 1;
    cursor: pointer;
  }
  #legendToggle:hover {
    background: rgba(255,255,255,0.1);
  }
  #legendToggle:focus-visible {
    outline: 2px solid #fff;
    outline-offset: 2px;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    opacity: 0.8;
    transition: opacity 0.2s;
  }
  .legend-item:hover { opacity: 1; }
  .legend-item.active { opacity: 1; font-weight: bold; }
  .legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  #info {
    position: fixed;
    top: 20px;
    right: 20px;
    color: rgba(255,255,255,0.5);
    font-size: 12px;
    text-align: right;
    z-index: 10;
  }
  #tooltip {
    position: fixed;
    padding: 6px 12px;
    background: rgba(0,0,0,0.85);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 6px;
    color: #fff;
    font-size: 13px;
    pointer-events: none;
    display: none;
    z-index: 100;
    white-space: nowrap;
  }
  @media (max-width: 768px) {
    #legendToggle {
      display: inline-flex;
    }
    #legend.is-mobile {
      top: 12px;
      left: 12px;
      width: min(78vw, 320px);
      height: calc(100dvh - 24px);
      padding: 12px;
      overflow-y: auto;
      background: rgba(0,0,0,0.88);
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 10px;
      transform: translateX(calc(-100% - 16px));
      opacity: 0;
      pointer-events: none;
      transition: transform 0.25s ease, opacity 0.2s ease;
    }
    #legend.is-mobile.is-open {
      transform: translateX(0);
      opacity: 1;
      pointer-events: auto;
    }
    #info {
      top: 12px;
      right: 12px;
      padding: 6px 8px;
      background: rgba(0,0,0,0.48);
      border-radius: 6px;
      font-size: 11px;
      line-height: 1.45;
    }
  }
</style>
</head>
<body>
<button id="legendToggle" type="button" aria-controls="legend" aria-expanded="false">&#48276;&#47168;</button>
<div id="legend"></div>
<div id="info">총 노드: <span id="totalCount">0</span>개<br><span style="font-size:11px;opacity:0.6">드래그: 회전 | 더블클릭: 초기화 | 호버: 정보</span></div>
<div id="tooltip"></div>
<canvas id="canvas"></canvas>

<script>
const data = [
  { name: "조용성", count: 755 },
  { name: "김준석", count: 522 },
  { name: "주선민", count: 374 },
  { name: "조소희", count: 352 },
  { name: "황지상", count: 279 },
  { name: "신민기", count: 238 },
  { name: "안해인", count: 85 },
  { name: "김아영", count: 82 },
  { name: "전민규", count: 67 },
  { name: "이근민", count: 63 },
  { name: "안명선", count: 56 },
  { name: "유지형", count: 53 },
  { name: "김주형", count: 42 },
  { name: "이선빈", count: 40 },
  { name: "최지연", count: 37 },
  { name: "엄숙민", count: 36 },
  { name: "안규은", count: 28 },
  { name: "홍석주", count: 24 },
  { name: "윤단비", count: 19 },
  { name: "정서연", count: 9 },
  { name: "남효신", count: 8 },
  { name: "문정인", count: 8 },
  { name: "조계훈", count: 7 },
  { name: "김성진", count: 6 },
  { name: "조소미", count: 3 },
];

const colors = [
  "#FF3366", "#FFaa00", "#00CCFF", "#FF66CC", "#66FF66",
  "#FFFF44", "#FF8833", "#AA66FF", "#00FFAA", "#FF4444",
  "#88CCFF", "#FFCCAA", "#CC88FF", "#44FFCC", "#FF6699",
  "#AADDFF", "#FFFFFF", "#33FF99", "#FF99CC", "#9999FF",
  "#CCFF33", "#FF3399", "#33CCFF", "#66FFFF", "#FF6633"
];

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const tooltip = document.getElementById("tooltip");
const legendEl = document.getElementById("legend");
const legendToggle = document.getElementById("legendToggle");
const MOBILE_BREAKPOINT = 768;
const CANVAS_MARGIN = 16;
const MIN_CANVAS_SIDE = 240;
const BASE_LAYOUT_SIDE = 920;
let W = 0, H = 0, centerX = 0, centerY = 0, radius = 0;
let nodes = [];
let links = [];
let isMobile = false;
let isLegendOpen = false;
let layoutScale = 1;

// View state: zoom + 3D sphere rotation
let zoom = 1;
let rotX = -0.32;            // pitch (vertical drag)
let rotY = 0;               // yaw (auto-rotating)
const AUTO_ROT_SPEED = 0.0018;
const FOCAL = 2.6;          // perspective focal length (x radius)

function updateNodeVisualScale() {
  if (!nodes.length) return;
  nodes.forEach((n) => {
    n.radius = Math.max(1.05, n.baseRadius * layoutScale);
  });
}

function applyResponsiveUI() {
  const mobileNow = window.innerWidth <= MOBILE_BREAKPOINT;
  const modeChanged = mobileNow !== isMobile;
  isMobile = mobileNow;

  if (!isMobile) {
    isLegendOpen = true;
  } else if (modeChanged) {
    isLegendOpen = false;
  }

  legendEl.classList.toggle("is-mobile", isMobile);
  legendEl.classList.toggle("is-open", !isMobile || isLegendOpen);
  legendToggle.setAttribute("aria-expanded", String(!isMobile || isLegendOpen));
  legendToggle.textContent = isMobile && isLegendOpen ? "\uB2EB\uAE30" : "\uBC94\uB840";
}

function resize() {
  const prevCenterX = centerX;
  const prevCenterY = centerY;
  const prevRadius = radius;
  const side = Math.max(
    MIN_CANVAS_SIDE,
    Math.min(window.innerWidth - CANVAS_MARGIN, window.innerHeight - CANVAS_MARGIN)
  );
  if (side === W && side === H) return false;

  W = canvas.width = side;
  H = canvas.height = side;
  canvas.style.width = side + "px";
  canvas.style.height = side + "px";
  layoutScale = Math.max(0.42, Math.min(1, side / BASE_LAYOUT_SIDE));
  centerX = W / 2;
  centerY = H / 2;
  radius = Math.min(W, H) * (0.45 + (1 - layoutScale) * 0.04);

  if (nodes.length && prevRadius > 0) {
    const ratio = radius / prevRadius;
    nodes.forEach((n) => {
      n.x *= ratio;
      n.y *= ratio;
      n.z *= ratio;
    });
  }
  updateNodeVisualScale();
  return true;
}
applyResponsiveUI();
resize();
let resizeQueued = false;
window.addEventListener("resize", () => {
  if (resizeQueued) return;
  resizeQueued = true;
  requestAnimationFrame(() => {
    resizeQueued = false;
    applyResponsiveUI();
    resize();
  });
});

function initNodes() {
  nodes = [];
  links = [];

  const totalNodes = data.reduce((s, d) => s + d.count, 0);
  document.getElementById("totalCount").textContent = totalNodes;

  data.forEach((group, gi) => {
    const color = colors[gi % colors.length];
    const groupNodes = [];

    for (let i = 0; i < group.count; i++) {
      const theta = Math.PI * 2 * Math.random();
      const phi = Math.acos(2 * Math.random() - 1);
      const r = radius * Math.cbrt(Math.random()) * 0.95;
      const sinPhi = Math.sin(phi);
      const baseRadius = group.count > 100 ? 2.5 : (group.count > 30 ? 3 : 3.5);
      const node = {
        x: r * sinPhi * Math.cos(theta),
        y: r * sinPhi * Math.sin(theta),
        z: r * Math.cos(phi),
        vx: (Math.random() - 0.5) * 0.5,
        vy: (Math.random() - 0.5) * 0.5,
        vz: (Math.random() - 0.5) * 0.5,
        color: color,
        group: gi,
        baseRadius: baseRadius,
        radius: Math.max(1.05, baseRadius * layoutScale),
        name: group.name,
      };
      nodes.push(node);
      groupNodes.push(node);
    }

    // create links within group (sparse)
    const maxLinks = Math.min(group.count * 2, group.count * (group.count - 1) / 2);
    const linkCount = Math.min(maxLinks, Math.floor(group.count * 1.5));
    for (let i = 0; i < linkCount; i++) {
      const a = groupNodes[Math.floor(Math.random() * groupNodes.length)];
      const b = groupNodes[Math.floor(Math.random() * groupNodes.length)];
      if (a !== b) {
        links.push({ source: a, target: b });
      }
    }

    // cross-group links (sparse)
    if (gi > 0) {
      const prevStart = nodes.length - group.count - data[gi - 1].count;
      const crossCount = Math.min(5, Math.floor(group.count * 0.05) + 1);
      for (let i = 0; i < crossCount; i++) {
        const a = groupNodes[Math.floor(Math.random() * groupNodes.length)];
        const bIdx = prevStart + Math.floor(Math.random() * data[gi - 1].count);
        if (bIdx >= 0 && bIdx < nodes.length) {
          links.push({ source: a, target: nodes[bIdx] });
        }
      }
    }
  });
}

initNodes();

// 3D force simulation
function simulate() {
  const cellSize = Math.max(16, 40 * layoutScale);
  const repelDist = Math.max(12, 30 * layoutScale);
  const linkTargetDist = Math.max(36, 80 * layoutScale);
  const grid = {};
  nodes.forEach(n => {
    const key = Math.floor(n.x / cellSize) + "," + Math.floor(n.y / cellSize) + "," + Math.floor(n.z / cellSize);
    if (!grid[key]) grid[key] = [];
    grid[key].push(n);
  });

  nodes.forEach(n => {
    const cx = Math.floor(n.x / cellSize);
    const cy = Math.floor(n.y / cellSize);
    const cz = Math.floor(n.z / cellSize);
    for (let dx = -1; dx <= 1; dx++) {
      for (let dy = -1; dy <= 1; dy++) {
        for (let dz = -1; dz <= 1; dz++) {
          const cell = grid[(cx + dx) + "," + (cy + dy) + "," + (cz + dz)];
          if (!cell) continue;
          for (const other of cell) {
            if (other === n) continue;
            const ddx = n.x - other.x;
            const ddy = n.y - other.y;
            const ddz = n.z - other.z;
            const dist = Math.sqrt(ddx * ddx + ddy * ddy + ddz * ddz) || 1;
            if (dist < repelDist) {
              const force = (repelDist - dist) * 0.012;
              n.vx += (ddx / dist) * force;
              n.vy += (ddy / dist) * force;
              n.vz += (ddz / dist) * force;
            }
          }
        }
      }
    }
  });

  nodes.forEach(n => {
    const dist = Math.sqrt(n.x * n.x + n.y * n.y + n.z * n.z) || 1;
    const overflow = dist - radius;
    if (overflow > 0) {
      const pull = Math.min(overflow * 0.01, 0.6);
      n.vx -= (n.x / dist) * pull;
      n.vy -= (n.y / dist) * pull;
      n.vz -= (n.z / dist) * pull;
    }
    n.vx -= n.x * 0.00012;
    n.vy -= n.y * 0.00012;
    n.vz -= n.z * 0.00012;
  });

  links.forEach(l => {
    const dx = l.target.x - l.source.x;
    const dy = l.target.y - l.source.y;
    const dz = l.target.z - l.source.z;
    const dist = Math.sqrt(dx * dx + dy * dy + dz * dz) || 1;
    if (dist > linkTargetDist) {
      const force = (dist - linkTargetDist) * 0.00006;
      const fx = dx / dist * force;
      const fy = dy / dist * force;
      const fz = dz / dist * force;
      l.source.vx += fx; l.source.vy += fy; l.source.vz += fz;
      l.target.vx -= fx; l.target.vy -= fy; l.target.vz -= fz;
    }
  });

  nodes.forEach(n => {
    n.vx *= 0.8;
    n.vy *= 0.8;
    n.vz *= 0.8;
    const speed = Math.sqrt(n.vx * n.vx + n.vy * n.vy + n.vz * n.vz);
    const maxSpeed = 0.6;
    if (speed > maxSpeed) {
      n.vx = (n.vx / speed) * maxSpeed;
      n.vy = (n.vy / speed) * maxSpeed;
      n.vz = (n.vz / speed) * maxSpeed;
    }
    n.x += n.vx;
    n.y += n.vy;
    n.z += n.vz;
  });
}

// Interaction state
let hoveredNode = null;
let highlightGroup = -1;
let isDragging = false;
let dragPrev = { x: 0, y: 0 };

// Hit test against last-projected screen positions, preferring nearest depth
function findNodeAt(sx, sy) {
  let best = null, bestRz = Infinity;
  for (const n of nodes) {
    if (n.sx === undefined) continue;
    const hit = Math.max(5, 8 * layoutScale) * n.persp + 2;
    const dx = sx - n.sx;
    const dy = sy - n.sy;
    if (dx * dx + dy * dy < hit * hit && n.rz < bestRz) {
      best = n;
      bestRz = n.rz;
    }
  }
  return best;
}

function getCanvasCoords(e) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: e.clientX - rect.left,
    y: e.clientY - rect.top
  };
}

// Mouse events
canvas.addEventListener("mousemove", (e) => {
  const pos = getCanvasCoords(e);

  if (isDragging) {
    rotY += (pos.x - dragPrev.x) * 0.006;
    rotX += (pos.y - dragPrev.y) * 0.006;
    rotX = Math.max(-1.4, Math.min(1.4, rotX));
    dragPrev.x = pos.x;
    dragPrev.y = pos.y;
    canvas.style.cursor = "grabbing";
    tooltip.style.display = "none";
    hoveredNode = null;
    return;
  }

  const node = findNodeAt(pos.x, pos.y);
  if (node) {
    hoveredNode = node;
    highlightGroup = node.group;
    canvas.style.cursor = "pointer";
    tooltip.style.display = "block";
    tooltip.style.left = (e.clientX + 14) + "px";
    tooltip.style.top = (e.clientY - 10) + "px";
    const d = data[node.group];
    tooltip.innerHTML = `<span style="color:${node.color}">●</span> ${d.name} <span style="opacity:0.5">(${d.count}개)</span>`;
  } else {
    hoveredNode = null;
    highlightGroup = -1;
    canvas.style.cursor = "grab";
    tooltip.style.display = "none";
  }
});

canvas.addEventListener("mousedown", (e) => {
  if (isMobile && isLegendOpen) {
    isLegendOpen = false;
    applyResponsiveUI();
  }
  const pos = getCanvasCoords(e);
  isDragging = true;
  dragPrev.x = pos.x;
  dragPrev.y = pos.y;
  canvas.style.cursor = "grabbing";
});

canvas.addEventListener("touchstart", () => {
  if (isMobile && isLegendOpen) {
    isLegendOpen = false;
    applyResponsiveUI();
  }
}, { passive: true });

canvas.addEventListener("mouseup", () => {
  isDragging = false;
  canvas.style.cursor = "grab";
});

canvas.addEventListener("mouseleave", () => {
  hoveredNode = null;
  highlightGroup = -1;
  tooltip.style.display = "none";
  isDragging = false;
});

// Double click to reset orientation
canvas.addEventListener("dblclick", () => {
  rotX = -0.32;
  rotY = 0;
  zoom = 1;
});

legendToggle.addEventListener("click", () => {
  if (!isMobile) return;
  isLegendOpen = !isLegendOpen;
  applyResponsiveUI();
});

window.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && isMobile && isLegendOpen) {
    isLegendOpen = false;
    applyResponsiveUI();
  }
});

// Depth fade: near (small rz) -> 1, far -> 0.3
function depthFactor(rz) {
  const t = (rz + radius) / (2 * radius);
  return 1 - 0.7 * Math.min(1, Math.max(0, t));
}

// Rotate a node and project to screen (stores sx, sy, persp, rz)
function project(n) {
  const cosY = Math.cos(rotY), sinY = Math.sin(rotY);
  const x1 = n.x * cosY - n.z * sinY;
  const z1 = n.x * sinY + n.z * cosY;
  const cosX = Math.cos(rotX), sinX = Math.sin(rotX);
  const y2 = n.y * cosX - z1 * sinX;
  const z2 = n.y * sinX + z1 * cosX;
  const focal = radius * FOCAL;
  const persp = focal / (focal + z2) * zoom;
  n.sx = centerX + x1 * persp;
  n.sy = centerY + y2 * persp;
  n.persp = persp;
  n.rz = z2;
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  nodes.forEach(project);

  const dimming = highlightGroup >= 0;

  // Draw links (depth-faded)
  links.forEach(l => {
    const s = l.source, t = l.target;
    let baseAlpha;
    if (dimming) {
      if (s.group === highlightGroup || t.group === highlightGroup) {
        baseAlpha = 0.16;
        ctx.strokeStyle = colors[highlightGroup] || "#ffffff";
      } else {
        baseAlpha = 0.012;
        ctx.strokeStyle = "#ffffff";
      }
    } else {
      baseAlpha = 0.05;
      ctx.strokeStyle = "#ffffff";
    }
    ctx.globalAlpha = baseAlpha * depthFactor(Math.min(s.rz, t.rz));
    ctx.lineWidth = 0.5 * ((s.persp + t.persp) / 2);
    ctx.beginPath();
    ctx.moveTo(s.sx, s.sy);
    ctx.lineTo(t.sx, t.sy);
    ctx.stroke();
  });

  // Draw nodes back-to-front for correct depth overlap
  const ordered = nodes.slice().sort((a, b) => b.rz - a.rz);
  ordered.forEach(n => {
    const depth = depthFactor(n.rz);
    if (dimming) {
      ctx.globalAlpha = (n.group === highlightGroup ? 1 : 0.1) * depth;
    } else {
      ctx.globalAlpha = 0.45 + 0.55 * depth;
    }
    const r = ((hoveredNode === n) ? n.radius * 2.4 : n.radius) * n.persp;
    ctx.beginPath();
    ctx.arc(n.sx, n.sy, Math.max(0.4, r), 0, Math.PI * 2);
    ctx.fillStyle = n.color;
    ctx.fill();
  });

  // Hovered node glow
  if (hoveredNode) {
    ctx.globalAlpha = 0.3;
    ctx.beginPath();
    ctx.arc(hoveredNode.sx, hoveredNode.sy, Math.max(6, 12 * layoutScale) * hoveredNode.persp, 0, Math.PI * 2);
    ctx.fillStyle = hoveredNode.color;
    ctx.fill();
  }

  ctx.globalAlpha = 1;
}

let frame = 0;
function animate() {
  simulate();
  if (!isDragging) rotY += AUTO_ROT_SPEED;
  draw();
  frame++;
  requestAnimationFrame(animate);
}
animate();

// Legend with click interaction
let legendHighlight = -1;

data.forEach((d, i) => {
  const item = document.createElement("div");
  item.className = "legend-item";
  item.innerHTML = `<span class="legend-dot" style="background:${colors[i]}"></span>
    <span>${d.name} (${d.count})</span>`;

  item.addEventListener("mouseenter", () => {
    highlightGroup = i;
    item.classList.add("active");
  });
  item.addEventListener("mouseleave", () => {
    if (legendHighlight < 0) highlightGroup = -1;
    item.classList.remove("active");
  });
  item.addEventListener("click", () => {
    if (legendHighlight === i) {
      legendHighlight = -1;
      highlightGroup = -1;
      item.classList.remove("active");
    } else {
      legendHighlight = i;
      highlightGroup = i;
      document.querySelectorAll(".legend-item").forEach(el => el.classList.remove("active"));
      item.classList.add("active");
    }
  });

  legendEl.appendChild(item);
});
</script>
</body>
</html>
